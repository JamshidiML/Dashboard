<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Control — JamshidiML</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  * { box-sizing: border-box; }

  :root {
    --bg: #12161A;
    --surface: #1B2126;
    --ink: #E7E3DA;
    --ink-dim: #9BA3A8;
    --ink-faint: #565F65;
    --line: #2E363C;
    --active: #5C8B93;
    --dormant: #C99A3D;
    --planning: #A8674B;
    --stale: #565F65;
    --danger: #B85C42;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 32px 20px 70px;
  }

  .wrap { max-width: 900px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .sync-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .summary {
    display: flex;
    gap: 20px;
    margin: 18px 0 26px;
    flex-wrap: wrap;
  }

  .summary .stat {
    font-family: 'IBM Plex Mono', monospace;
  }
  .summary .stat b {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    display: block;
    color: var(--ink);
  }
  .summary .stat span { font-size: 11px; color: var(--ink-dim); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filters button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .filters button.on { border-color: var(--ink); color: var(--ink); }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
  }

  .card {
    background: var(--bg);
    padding: 16px 4px;
    display: grid;
    grid-template-columns: 3px 1fr auto;
    gap: 14px;
    align-items: start;
  }

  .card .bar { align-self: stretch; min-height: 40px; }

  .card .main { min-width: 0; }

  .card .top-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .card .status-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    text-transform: lowercase;
  }

  .card .desc {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .card .update-lines {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .card .update-lines .l2 { color: var(--ink-dim); }

  .card .meta {
    margin-top: 8px;
    display: flex;
    gap: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-faint);
    flex-wrap: wrap;
  }

  .spark {
    width: 130px;
  }
  .spark svg { display: block; }

  .ratio-track {
    width: 130px;
    height: 4px;
    background: var(--line);
    margin-top: 8px;
    display: flex;
  }
  .ratio-fill { height: 100%; }

  .empty-note {
    padding: 14px 4px;
    font-size: 12.5px;
    color: var(--ink-faint);
    font-style: normal;
  }

  .block { margin-bottom: 30px; }
  .block-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .block-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .block-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .stock-table { display: flex; flex-direction: column; }
  .stock-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 2px;
    border-bottom: 1px solid #1D2328;
    font-size: 13px;
  }
  .stock-row .name { flex: 1; }
  .stock-row .price { font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); width: 90px; text-align: right; }
  .stock-row .chg { font-family: 'IBM Plex Mono', monospace; width: 70px; text-align: right; }
  .chg.up { color: var(--active); }
  .chg.down { color: var(--danger); }

  .crypto-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .crypto-card { min-width: 200px; }
  .crypto-card .sym { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
  .crypto-card .price { font-family: 'IBM Plex Mono', monospace; font-size: 18px; margin: 4px 0; }
  .crypto-card svg { display: block; margin-top: 6px; }

  .news-list { display: flex; flex-direction: column; gap: 10px; }
  .news-item { font-size: 13px; line-height: 1.4; }
  .news-item a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .news-item a:hover { border-color: var(--ink); }

  .conf-list { display: flex; flex-direction: column; gap: 10px; }
  .conf-item { font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .conf-item .cname { font-weight: 600; }
  .conf-item .cmeta { color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }

  @media (max-width: 560px) {
    .card { grid-template-columns: 3px 1fr; }
    .spark { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Portfolio Control</h1>
    <div class="sync-line" id="syncLine">loading…</div>
    <div class="legend">
      <span><i style="background:var(--active)"></i>active</span>
      <span><i style="background:var(--dormant)"></i>dormant</span>
      <span><i style="background:var(--planning)"></i>planning-only</span>
      <span><i style="background:var(--stale)"></i>stale / empty</span>
    </div>
  </header>

  <section class="block">
    <div class="block-head"><h2>Market pulse</h2><span class="block-sub" id="marketSync"></span></div>
    <div class="stock-table" id="stockTable"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Crypto</h2></div>
    <div class="crypto-row" id="cryptoRow"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Tech &amp; AI news</h2></div>
    <div class="news-list" id="newsList"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Industry &amp; AI events</h2><span class="block-sub">curated, not auto-refreshed</span></div>
    <div class="conf-list" id="confList"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Repositories</h2></div>
    <div class="summary" id="summary"></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const STATUS_COLOR = {
  active: 'var(--active)',
  dormant: 'var(--dormant)',
  planning: 'var(--planning)',
  stale: 'var(--stale)',
  empty: 'var(--stale)',
};

function daysAgo(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}

function relTime(dateStr) {
  const d = daysAgo(dateStr);
  if (d === null) return 'no activity';
  if (d === 0) return 'today';
  if (d === 1) return '1 day ago';
  if (d < 30) return d + ' days ago';
  if (d < 365) return Math.round(d / 30) + ' months ago';
  return Math.round(d / 365) + ' years ago';
}

function sparkline(weekly) {
  const w = 130, h = 32, n = weekly.length;
  if (!n) return '';
  const max = Math.max(...weekly, 1);
  const barW = w / n - 1;
  let bars = '';
  weekly.forEach((v, i) => {
    const bh = Math.max(1, (v / max) * h);
    const x = i * (w / n);
    const y = h - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--ink-faint)" />`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

// Deterministic fallback shape when no real weekly series exists yet
// (first run before the GitHub Action has generated real commit_activity data)
function fallbackWeekly(repo) {
  const n = 12;
  if (!repo.commit_count) return new Array(n).fill(0);
  const arr = new Array(n).fill(0);
  const spike = Math.min(n - 1, 3);
  arr[n - 1 - spike] = repo.commit_count;
  return arr;
}

function renderSummary(repos) {
  const counts = { active: 0, dormant: 0, planning: 0, stale: 0, empty: 0 };
  repos.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  const el = document.getElementById('summary');
  el.innerHTML = `
    <div class="stat"><b>${repos.length}</b><span>repositories</span></div>
    <div class="stat"><b>${counts.active}</b><span>active</span></div>
    <div class="stat"><b>${counts.dormant}</b><span>dormant</span></div>
    <div class="stat"><b>${counts.planning}</b><span>planning-only</span></div>
    <div class="stat"><b>${(counts.stale||0)+(counts.empty||0)}</b><span>stale / empty</span></div>
  `;
}

function renderFilters(repos, onFilter) {
  const statuses = ['all', 'active', 'dormant', 'planning', 'stale'];
  const el = document.getElementById('filters');
  el.innerHTML = '';
  statuses.forEach(s => {
    const btn = document.createElement('button');
    btn.textContent = s;
    if (s === 'all') btn.classList.add('on');
    btn.onclick = () => {
      [...el.children].forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      onFilter(s);
    };
    el.appendChild(btn);
  });
}

function renderGrid(repos) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (repos.length === 0) {
    grid.innerHTML = '<div class="empty-note">No repositories match this filter.</div>';
    return;
  }

  repos.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.status = r.status;

    const color = STATUS_COLOR[r.status] || 'var(--stale)';
    const weekly = r.weekly_commits || fallbackWeekly(r);
    const totalLoc = (r.code_loc || 0) + (r.doc_loc || 0);
    const codePct = totalLoc ? Math.round((r.code_loc / totalLoc) * 100) : 0;

    card.innerHTML = `
      <div class="bar" style="background:${color}"></div>
      <div class="main">
        <div class="top-row">
          <h3>${r.name}</h3>
          <span class="status-label">${r.status}</span>
        </div>
        <div class="desc">${r.description || 'No description'}</div>
        <div class="update-lines">
          <div class="l1">${r.update_line1 || ''}</div>
          <div class="l2">${r.update_line2 || ''}</div>
        </div>
        <div class="meta">
          <span>${r.commit_count ?? '—'} commits</span>
          <span>${relTime(r.last_commit)}</span>
          <span>${r.has_tests ? 'tests ✓' : 'no tests'}</span>
          <span>${r.has_ci ? 'CI ✓' : 'no CI'}</span>
        </div>
        <div class="ratio-track" title="${codePct}% code / ${100-codePct}% docs">
          <div class="ratio-fill" style="width:${codePct}%; background:${color}"></div>
        </div>
      </div>
      <div class="spark">${sparkline(weekly)}</div>
    `;
    grid.appendChild(card);
  });
}

function renderStocks(stocks) {
  const el = document.getElementById('stockTable');
  el.innerHTML = stocks.map(s => {
    const dir = s.change_pct > 0 ? 'up' : s.change_pct < 0 ? 'down' : '';
    const sign = s.change_pct > 0 ? '+' : '';
    return `<div class="stock-row">
      <span class="name">${s.label}</span>
      <span class="price">${s.close != null ? '$' + s.close.toFixed(2) : '—'}</span>
      <span class="chg ${dir}">${s.change_pct != null ? sign + s.change_pct.toFixed(2) + '%' : '—'}</span>
    </div>`;
  }).join('');
}

function miniSparkSvg(series, color) {
  if (!series || series.length < 2) return '';
  const w = 160, h = 36;
  const min = Math.min(...series), max = Math.max(...series);
  const range = (max - min) || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

function renderCrypto(crypto) {
  const el = document.getElementById('cryptoRow');
  el.innerHTML = crypto.map(c => {
    const dir = c.change_24h_pct > 0 ? 'var(--active)' : 'var(--danger)';
    const sign = c.change_24h_pct > 0 ? '+' : '';
    return `<div class="crypto-card">
      <div class="sym">${c.symbol}</div>
      <div class="price">$${c.price?.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
      <div class="chg ${c.change_24h_pct > 0 ? 'up' : 'down'}">${c.change_24h_pct != null ? sign + c.change_24h_pct.toFixed(2) + '% (24h)' : ''}</div>
      ${miniSparkSvg(c.sparkline_7d, dir)}
    </div>`;
  }).join('');
}

function renderNews(news) {
  const el = document.getElementById('newsList');
  if (!news.length) { el.innerHTML = '<div class="empty-note">No items yet — run the update workflow.</div>'; return; }
  el.innerHTML = news.map(n =>
    `<div class="news-item"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>`
  ).join('');
}

function renderConferences(events) {
  const el = document.getElementById('confList');
  el.innerHTML = events.map(e =>
    `<div class="conf-item"><span class="cname">${e.name}</span><span class="cmeta">${e.dates} · ${e.location}</span></div>`
  ).join('');
}

async function init() {
  let data, market, conferences;
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    document.getElementById('syncLine').textContent = 'Could not load data.json — run the update workflow once.';
    return;
  }
  try {
    const [mRes, cRes] = await Promise.all([
      fetch('./market.json', { cache: 'no-store' }),
      fetch('./conferences.json', { cache: 'no-store' }),
    ]);
    market = await mRes.json();
    conferences = await cRes.json();
  } catch (e) {
    market = { stocks: [], crypto: [], news: [] };
    conferences = { events: [] };
  }

  const repos = data.repos;
  document.getElementById('syncLine').textContent =
    `Last synced ${relTime(data.generated_at)} · source: ${data.generated_by || 'unknown'}`;
  document.getElementById('marketSync').textContent =
    market.generated_at ? `synced ${relTime(market.generated_at)}` : '';

  renderStocks(market.stocks || []);
  renderCrypto(market.crypto || []);
  renderNews(market.news || []);
  renderConferences(conferences.events || []);

  renderSummary(repos);
  renderFilters(repos, (status) => {
    const filtered = status === 'all' ? repos : repos.filter(r => r.status === status);
    renderGrid(filtered);
  });
  renderGrid(repos);
}

init();
</script>
</body>
</html>
