name: Update dashboard data

on:
  schedule:
    # 18:00 Europe/Berlin (16:00 UTC in summer / 17:00 UTC in winter) — adjust as needed
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate data.json (repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-data.mjs JamshidiML

      - name: Regenerate market.json (stocks/crypto/news)
        run: node scripts/market-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json market.json
          git diff --quiet --cached || (git commit -m "chore: refresh dashboard data" && git push)
